<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bio x AI investment committee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF1F2; --surface:#F9FBFB; --sunk:#E3E9EB;
  --ink:#14212B; --ink-2:#4B5A65; --ink-3:#77848D; --rule:#C8D2D6;
  --accent:#1D5C88; --accent-ink:#FFFFFF; --accent-weak:rgba(29,92,136,.10);
  --tA:#13816A; --tB:#2C65B0; --tC:#B5761A; --tD:#8C6AA9; --tU:#C23F37;
  --ui:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --read:"Spectral", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1317; --surface:#141C21; --sunk:#10171B;
    --ink:#E3E9EC; --ink-2:#A3B0B8; --ink-3:#76848D; --rule:#27323A;
    --accent:#86B8E0; --accent-ink:#0D1317; --accent-weak:rgba(134,184,224,.14);
    --tA:#3CC09E; --tB:#72A3EA; --tC:#E2A64B; --tD:#B99AD9; --tU:#EF6E64;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1317; --surface:#141C21; --sunk:#10171B;
  --ink:#E3E9EC; --ink-2:#A3B0B8; --ink-3:#76848D; --rule:#27323A;
  --accent:#86B8E0; --accent-ink:#0D1317; --accent-weak:rgba(134,184,224,.14);
  --tA:#3CC09E; --tB:#72A3EA; --tC:#E2A64B; --tD:#B99AD9; --tU:#EF6E64;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:400 15px/1.5 var(--ui)}
a{color:var(--accent); text-underline-offset:2px}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.shell{max-width:1080px; margin:0 auto; padding:20px 20px 64px}
.top{display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 24px; padding-bottom:14px; border-bottom:1px solid var(--rule)}
.brand h1{margin:0; font:500 30px/1.15 var(--read); letter-spacing:-.01em}
.brand p{margin:4px 0 0; color:var(--ink-2); max-width:62ch}
.status{margin-left:auto; color:var(--ink-3); font-size:13px; display:flex; flex-wrap:wrap; gap:4px 14px}
.status span::before{content:""; display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; background:var(--ink-3); vertical-align:1px}
.status .ok::before{background:var(--tA)} .status .warn::before{background:var(--tC)} .status .bad::before{background:var(--tU)}
nav#nav{display:flex; gap:2px; overflow-x:auto; padding:10px 0 0; margin:0 -4px; scrollbar-width:none}
nav#nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto; border:0; background:none; padding:8px 12px; border-radius:6px; color:var(--ink-2); cursor:pointer}
.tab[aria-current="page"]{background:var(--surface); color:var(--ink); box-shadow:inset 0 -2px 0 var(--accent)}
.tab .n{color:var(--ink-3); margin-left:6px; font-size:12px}
main{padding-top:22px}
h2.view{margin:0 0 6px; font:500 26px/1.2 var(--read)}
.lead{margin:0 0 18px; color:var(--ink-2); max-width:70ch}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.read{font-family:var(--read); font-size:17px; line-height:1.6}
.bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 18px}
.grow{flex:1}
.btn{border:1px solid var(--rule); background:var(--surface); padding:7px 12px; border-radius:6px; cursor:pointer; line-height:1.3}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.quiet{border-color:transparent; background:none; color:var(--ink-2)}
.btn.quiet:hover{color:var(--ink); border-color:var(--rule)}
.btn.danger{color:var(--tU); border-color:transparent; background:none}
.btn.small{padding:4px 8px; font-size:13px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.linkbtn{border:0; background:none; padding:0; color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:2px; text-align:left}
input,select,textarea{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:7px 9px; width:100%}
textarea{min-height:90px; resize:vertical; line-height:1.5}
select{width:auto}
.filters{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px}
.filters input{max-width:280px}
/* evidence lanes: the one memorable device */
.lane{display:inline-flex; gap:3px; align-items:center; vertical-align:middle}
.band{display:inline-block; width:16px; height:6px; border-radius:1px; background:var(--ink-3)}
.lane-l .band{width:26px; height:8px}
.band.tA{background:var(--tA)} .band.tB{background:var(--tB)} .band.tC{background:var(--tC)} .band.tD{background:var(--tD)} .band.tU{background:transparent; box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.band.hollow{background:transparent !important; box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.band.against{background:repeating-linear-gradient(135deg, var(--tU) 0 3px, transparent 3px 6px) !important; box-shadow:inset 0 0 0 1px var(--tU)}
.tier{display:inline-grid; place-items:center; min-width:22px; height:20px; padding:0 5px; border-radius:4px; font-weight:600; font-size:12px; color:#fff; background:var(--ink-3)}
.tier.tA{background:var(--tA)} .tier.tB{background:var(--tB)} .tier.tC{background:var(--tC)} .tier.tD{background:var(--tD)} .tier.tU{background:transparent; color:var(--tU); box-shadow:inset 0 0 0 1.5px var(--tU)}
:root[data-theme="dark"] .tier:not(.tU){color:#0D1317}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tier:not(.tU){color:#0D1317} }
.chip{display:inline-block; padding:1px 8px; border-radius:999px; border:1px solid var(--rule); font-size:12.5px; color:var(--ink-2); background:var(--surface)}
.chip.lead{border-color:var(--accent); color:var(--accent)}
.chip.support{border-color:var(--tA); color:var(--tA)} .chip.oppose{border-color:var(--tU); color:var(--tU)} .chip.mixed{border-color:var(--tC); color:var(--tC)}
/* lists */
.rows{border-top:1px solid var(--rule)}
.row{display:grid; grid-template-columns:auto 1fr auto; gap:6px 16px; padding:14px 2px; border-bottom:1px solid var(--rule); align-items:start}
.row.th{grid-template-columns:172px 1fr auto}
.row.click{cursor:pointer} .row.click:hover{background:var(--accent-weak)}
.row h3{margin:0; font:500 19px/1.3 var(--read)}
.row .meta{color:var(--ink-3); font-size:13px}
.row p{margin:4px 0 0}
.nums{display:flex; gap:18px; flex-wrap:wrap; align-items:baseline}
.num b{font:500 24px/1 var(--read)} .num span{display:block; color:var(--ink-3); font-size:12.5px}
/* thesis detail */
.back{margin:0 0 10px}
.th-title{margin:0 0 6px; font:500 34px/1.12 var(--read); letter-spacing:-.01em; max-width:30ch}
.oneliner{max-width:68ch; margin:0 0 10px}
.section{margin:30px 0 0}
.section > h3{margin:0 0 10px; font:600 15px/1.3 var(--ui)}
.assume{display:grid; grid-template-columns:34px 1fr; gap:4px 14px; padding:12px 0; border-bottom:1px solid var(--rule)}
.assume .band{margin-top:9px}
.assume .txt{font-family:var(--read); font-size:16.5px; line-height:1.55}
.assume .ctl{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-top:6px; font-size:13px; color:var(--ink-3)}
.evchip{border:0; background:var(--sunk); padding:2px 7px 2px 3px; border-radius:5px; font-size:12.5px; color:var(--ink-2); cursor:pointer; display:inline-flex; gap:5px; align-items:center}
.evchip .tier{height:16px; min-width:16px; font-size:10.5px}
.scroll{overflow-x:auto}
table{border-collapse:collapse; width:100%; min-width:560px}
th,td{text-align:left; padding:8px 10px 8px 0; border-bottom:1px solid var(--rule); vertical-align:top}
th{font-weight:600; font-size:13px; color:var(--ink-2)}
.meter{display:inline-block; width:70px; height:6px; background:var(--sunk); border-radius:3px; vertical-align:middle; margin-right:6px; overflow:hidden}
.meter i{display:block; height:100%; background:var(--accent)}
ul.plain{margin:0; padding-left:18px} ul.plain li{margin:4px 0}
/* memos */
.memo{padding:16px 0; border-bottom:1px solid var(--rule)}
.memo h4{margin:0; font:600 15px/1.3 var(--ui); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.memo .headline{font:500 18px/1.4 var(--read); margin:6px 0}
.claims{list-style:none; margin:8px 0 0; padding:0}
.claims li{display:grid; grid-template-columns:24px 1fr; gap:8px; padding:4px 0}
.chairbox{margin-top:18px; padding:16px 18px; border-left:3px solid var(--accent); background:var(--surface)}
.verdict{font:500 22px/1.2 var(--read); text-transform:none}
/* dialogs */
dialog{border:1px solid var(--rule); border-radius:10px; padding:0; width:min(700px, calc(100vw - 20px)); max-height:88vh; background:var(--bg); color:var(--ink)}
dialog::backdrop{background:rgba(10,16,20,.45)}
.dlg{padding:20px 20px 16px; overflow:auto; max-height:88vh}
.dlg h2{margin:0 0 6px; font:500 22px/1.25 var(--read)}
.field{margin:12px 0}
.field label{display:block; font-weight:500; margin-bottom:4px}
.field .hint{color:var(--ink-3); font-size:12.5px; margin-top:3px}
.checks{max-height:240px; overflow:auto; border:1px solid var(--rule); border-radius:6px; padding:6px 8px; background:var(--surface)}
.checks label{display:flex; gap:8px; align-items:flex-start; font-weight:400; padding:4px 0; margin:0}
.checks input{width:auto; margin-top:4px}
.form-actions{display:flex; gap:8px; align-items:center; margin-top:16px; position:sticky; bottom:-16px; background:var(--bg); padding:10px 0 6px}
.form-err{color:var(--tU); min-height:1em; margin:6px 0 0}
.steps{list-style:none; margin:12px 0; padding:0}
.steps li{display:grid; grid-template-columns:18px 1fr; gap:10px; padding:8px 0; border-bottom:1px solid var(--rule)}
.dot{width:10px; height:10px; border-radius:50%; margin-top:6px; background:var(--rule)}
.dot.thinking{background:var(--tC); animation:pulse 1.2s ease-in-out infinite}
.dot.done{background:var(--tA)} .dot.failed{background:var(--tU)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){ .dot.thinking{animation:none} }
.chat{display:flex; flex-direction:column; gap:10px; margin:12px 0; max-height:48vh; overflow:auto; padding-right:4px}
.msg{padding:10px 12px; border-radius:8px; max-width:92%; white-space:pre-wrap}
.msg.user{align-self:flex-end; background:var(--accent-weak)}
.msg.agent{align-self:flex-start; background:var(--surface); border:1px solid var(--rule); font-family:var(--read); font-size:16px; line-height:1.55}
.toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 14px; border-radius:8px; font-size:14px; max-width:min(560px, calc(100vw - 24px)); opacity:0; pointer-events:none; transition:opacity .2s}
.toast.show{opacity:1}
.empty{padding:26px 0; color:var(--ink-2); max-width:60ch}
.kv{display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; margin:8px 0}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin:0 0 18px; color:var(--ink-2); font-size:13px}
.legend span{display:inline-flex; gap:6px; align-items:center}
pre.protocol{white-space:pre-wrap; background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:12px; font:14px/1.5 var(--ui)}
/* horses and calls */
table.wide{min-width:860px}
td.n, th.n{font-variant-numeric:tabular-nums; white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-weak)}
.checkbar{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin:0 0 14px; font-size:13px; color:var(--ink-3)}
.blind{display:grid; grid-template-columns:140px 76px 1fr; gap:6px 10px; align-items:center; padding:4px 0}
.blind label{margin:0 !important; font-weight:400 !important}
.evtag{display:inline-flex; gap:4px; align-items:center; background:var(--sunk); padding:1px 6px 1px 2px; border-radius:5px; font-size:12px; color:var(--ink-2); margin:1px 4px 1px 0}
.evtag .tier{height:15px; min-width:15px; font-size:10px}
textarea.draft{min-height:320px; font:15px/1.55 var(--read)}
@media (max-width:640px){
  .shell{padding:14px 14px 56px}
  .brand h1{font-size:25px}
  .th-title{font-size:27px}
  .row, .row.th{grid-template-columns:1fr; gap:6px}
  .status{margin-left:0}
  .blind{grid-template-columns:1fr 76px}
  .blind > span{grid-column:1 / -1}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <h1>Bio x AI investment committee</h1>
      <p>Theses argued from first principles, with every claim graded by the evidence behind it.</p>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <nav id="nav" aria-label="Sections" style="flex-basis:100%"></nav>
  </header>
  <main id="view"></main>
</div>
<dialog id="dlg" aria-label="Form"></dialog>
<dialog id="runDlg" aria-label="Committee in session"></dialog>
<dialog id="sparDlg" aria-label="Sparring"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ---------- state ---------- */
const COLLS = ["axioms", "evidence", "theses", "sessions", "entities", "concepts", "research", "agents", "horses", "rankings", "calls"];
const TIERS = ["A", "B", "C", "D", "U"];
const TIER_INFO = {
  A: "Validated: peer-reviewed result, clinical guideline or regulatory decision",
  B: "Demand: audited or filed financials, disclosed transactions",
  C: "Claimed: company statements, preprints, trade reporting",
  D: "Belief: funding rounds and valuations",
  U: "Unsourced: model or personal recall, must be verified"
};
const DOMAINS = ["first-principles", "technical", "clinical", "regulatory", "market", "company", "industry", "relations", "founder"];
const STAGES = [
  ["data", "Data and labs"], ["models", "Models"], ["discovery", "Discovery"], ["development", "Development"],
  ["patients", "Patients"], ["trust", "Trust layer"], ["infrastructure", "Infrastructure"], ["relations", "People and relationships"]
];
const STATUSES = ["supported", "contested", "unsupported", "against"];
const S = {
  db: null, sample: null, mcp: null, dl: null, canTools: false,
  dbState: "connecting", claudeState: "connecting",
  data: {}, meta: null, loaded: {},
  ui: { tab: "theses", sel: {}, q: "", tierF: "all", domF: "all", resF: "open", hLaneF: "all", hStatF: "all", busy: {} },
  run: null, spar: null
};
COLLS.forEach(c => { S.data[c] = []; });

/* ---------- helpers ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);
function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
function safeUrl(u) { try { const x = new URL(String(u)); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : ""; } catch (e) { return ""; } }
function link(u, text) { const s = safeUrl(u); return s ? `<a href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(text || s)}</a>` : esc(text || ""); }
function slug(s) { return String(s || "item").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 36) || "item"; }
function newId(prefix, title) { return `${prefix}-${slug(title)}-${Math.random().toString(36).slice(2, 7)}`; }
function arr(v) { return Array.isArray(v) ? v : []; }
function str(v) { return v == null ? "" : String(v); }
function trunc(s, n) { s = str(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function byId(coll, id) { return S.data[coll].find(d => d.id === id); }
function nowIso() { return new Date().toISOString(); }
function fmtDate(iso) { if (!iso) return ""; const d = new Date(iso); if (isNaN(d)) return str(iso); return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
function tierOf(t) { return TIERS.includes(t) ? t : "U"; }
function tierChip(t) { t = tierOf(t); return `<span class="tier t${t}" title="${esc(TIER_INFO[t])}">${t}</span>`; }
function rubric() { const r = arr(S.meta && S.meta.rubric); return r.length ? r : [{ id: "evidence", name: "Evidence strength", weight: 1, question: "How strong is the evidence?" }]; }
function stageName(id) { const s = STAGES.find(x => x[0] === id); return s ? s[1] : (id || "Other"); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3600); }
function errText(e) {
  if (!e) return "The action did not complete.";
  const c = e.code;
  if (c === "invalid_argument") return "This view can read the committee but cannot change it.";
  if (c === "quota_exceeded") return "The record store is full. Delete old items, then try again.";
  if (c === "resource_exhausted") return "Too many requests at once. Wait a moment, then try again.";
  if (c === "rate_limited") return "Claude is at capacity for this account right now. Try again in a few minutes.";
  if (c === "not_granted") return "Claude access was declined for this page. Reload the page to be asked again.";
  if (c === "sampling_disabled") return "Claude is not available for this account.";
  if (c === "prompt_too_large") return "The briefing is too long for one call. Remove some evidence or shorten the question.";
  if (c === "refused") return "Claude declined this request. Rephrase the question.";
  if (c === "session_expired") return "Your session expired. Sign in again, then reload.";
  if (c === "server_not_connected") return "PubMed is not connected. Add it in claude.ai Settings, Connectors.";
  if (c === "needs_reauth") return "PubMed needs reconnecting in claude.ai Settings, Connectors.";
  return e.message || "The action did not complete.";
}

/* ---------- metrics: the eval harness ---------- */
function evTier(id) { const e = byId("evidence", id); return e ? tierOf(e.tier) : null; }
function bestTier(ids) {
  let best = null;
  for (const id of arr(ids)) { const t = evTier(id); if (t && (best === null || TIERS.indexOf(t) < TIERS.indexOf(best))) best = t; }
  return best || "U";
}
function metrics(t) {
  let num = 0, den = 0;
  for (const c of rubric()) {
    const sc = t.scorecard && t.scorecard[c.id] && t.scorecard[c.id].score;
    if (typeof sc === "number") num += sc * (Number(c.weight) || 1);
    den += 5 * (Number(c.weight) || 1);
  }
  const lb = arr(t.assumptions).filter(a => a.load_bearing !== false);
  const sup = lb.filter(a => a.status === "supported" && ["A", "B"].includes(bestTier(a.evidence)));
  const gaps = lb.filter(a => a.status === "unsupported" || !arr(a.evidence).length);
  const against = lb.filter(a => a.status === "against");
  return { score: den ? Math.round(100 * num / den) : 0, coverage: lb.length ? Math.round(100 * sup.length / lb.length) : 0, gaps: gaps.length, against: against.length, n: lb.length };
}
function bandClass(a) {
  const t = bestTier(a.evidence);
  if (a.status === "against") return `band t${t} against`;
  if (a.status === "unsupported" || !arr(a.evidence).length) return "band hollow";
  return `band t${t}`;
}
function lane(assumptions, size) {
  return `<span class="lane lane-${size || "s"}" aria-hidden="true">${arr(assumptions).map(a => `<i class="${bandClass(a)}"></i>`).join("")}</span>`;
}
function statusRank(s) { return { lead: 0, active: 1, parked: 2, killed: 3 }[s] ?? 4; }

/* ---------- horse engine: pure functions (tested by committee/engine.test.mjs) ---------- */
const HORSE_TESTS = [
  { id: "mechanism", n: 1, name: "Mechanism", cap: "core" }, { id: "exposure", n: 2, name: "Exposure", cap: "core" },
  { id: "comparator", n: 3, name: "Comparator", cap: "core" }, { id: "population", n: 4, name: "Population", cap: "core" },
  { id: "design", n: 5, name: "Design", cap: "core" }, { id: "value_gap", n: 6, name: "Value gap", cap: "value" },
  { id: "leverage", n: 7, name: "Leverage", cap: "leverage" }, { id: "access", n: 8, name: "Access", cap: "none" }
];
const SCORED_TESTS = HORSE_TESTS.filter(t => t.cap !== "none");
const CORE_TESTS = HORSE_TESTS.filter(t => t.cap === "core").map(t => t.id);
const ENGINE_DEFAULTS = { p0: 0.15, slope: 0.05, back_p: 0.6, back_v: 2, back_l: 2, spread_pass: 2, non_consensus_pass: 2, stability_max_move: 1, stability_days: 31 };
const BASIS_TESTS = ["exposure", "comparator", "leverage"];
function r4(x) { return Math.round(x * 1e4) / 1e4; }

function capClass(testId) { const t = HORSE_TESTS.find(x => x.id === testId); return t ? t.cap : "none"; }

function tierCap(testId, tiers) {

}

  if (!arr(tiers).length) return `${name} cannot score above 0 without a cited evidence record.`;
  const c = capClass(testId);
  const need = c === "core" ? (score === 3 ? "at least one A or B citation" : "at least one C or better citation")
    : c === "value" ? "a B or D citation (a disclosed deal or a valuation)" : "a C or better citation";
  const best = [...arr(tiers)].sort((a, b) => TIERS.indexOf(a) - TIERS.indexOf(b))[0];

function changeAllowed(prevScore, newScore, citedIds, addedAtOf, lastSnapAt) {

}
// Rank by E; ties go to the nearer catalyst (undated last), then name.
function rankHorses(horses, p) {

  rows.sort((a, b) => (b.E - a.E) || ((a.catalyst || "9999") < (b.catalyst || "9999") ? -1 : (a.catalyst || "9999") > (b.catalyst || "9999") ? 1 : 0) || a.name.localeCompare(b.name) || a.horse.localeCompare(b.horse));

}
function maxRankMove(a, b) {
  const m = new Map(arr(b).map(r => [r.horse, r.rank])); let mx = 0;
  arr(a).forEach(r => { if (m.has(r.horse)) mx = Math.max(mx, Math.abs(r.rank - m.get(r.horse))); });

}
function brierScore(prob, outcome) { return r4(Math.pow(prob - (outcome ? 1 : 0), 2)); }

/* ---------- init ---------- */
function init() {
  render();
  if (!window.claude || typeof window.claude.use !== "function") { S.dbState = "absent"; S.claudeState = "absent"; render(); return; }
  window.claude.use("db").then(db => {
    S.db = db;
    if (!db) { S.dbState = "absent"; render(); return; }
    S.dbState = "connected";
    subscribeAll();
    render();
  }).catch(() => { S.dbState = "absent"; render(); });
  window.claude.use("sample").then(async s => {
    S.sample = s; S.claudeState = s ? "ready" : "absent";
    if (s) { try { const l = await s.limits(); S.canTools = !!(l && l.tools); } catch (e) { S.canTools = false; } }
    render();
  }).catch(() => { S.claudeState = "absent"; render(); });
  window.claude.use("mcp").then(m => { S.mcp = m; render(); }).catch(() => {});
  window.claude.use("downloads").then(d => { S.dl = d; render(); }).catch(() => {});
}

function subscribeAll() {
  for (const c of COLLS) {
    S.db.collection(c).onSnapshot(snap => {
      S.data[c] = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      S.loaded[c] = true; render();
    }, err => { S.loaded[c] = true; if (err && err.code === "revoked") S.dbState = "absent"; render(); });
  }
  S.db.doc("meta/config").onSnapshot(d => { S.meta = d.exists ? d.data() : null; render(); }, () => {});
}

/* ---------- render ---------- */
let rafPending = false;
function render() { if (rafPending) return; rafPending = true; requestAnimationFrame(() => { rafPending = false; doRender(); }); }
function doRender() {
  const a = document.activeElement; const aid = a && a.id; let pos = null;
  try { pos = a && typeof a.selectionStart === "number" ? a.selectionStart : null; } catch (e) { pos = null; }
  $("#nav").innerHTML = navHtml();
  $("#status").innerHTML = statusHtml();
  $("#view").innerHTML = viewHtml();
  if (aid && (aid === "q")) { const el = document.getElementById(aid); if (el) { el.focus(); if (pos != null) { try { el.setSelectionRange(pos, pos); } catch (e) {} } } }
}
const TABS = [
  ["theses", "Theses", "theses"], ["horses", "Horses", "horses"], ["calls", "Calls", "calls"], ["sessions", "Records", "sessions"], ["evidence", "Evidence", "evidence"],
  ["principles", "First principles", "axioms"], ["landscape", "Landscape", "entities"], ["research", "Research queue", "research"],

function statusHtml() {

function viewEvidence() {
  const q = S.ui.q.toLowerCase();
  let ev = S.data.evidence.filter(e => (S.ui.tierF === "all" || tierOf(e.tier) === S.ui.tierF) && (S.ui.domF === "all" || e.domain === S.ui.domF));
  if (q) ev = ev.filter(e => (str(e.claim) + " " + str(e.source) + " " + str(e.notes)).toLowerCase().includes(q));
  ev.sort((a, b) => (TIERS.indexOf(tierOf(a.tier)) - TIERS.indexOf(tierOf(b.tier))) || str(b.date).localeCompare(str(a.date)));
  return `<h2 class="view">Evidence</h2><p class="lead">Atomic claims, each with its source and tier. Funding and valuations are belief, not proof; they sit in tier D whatever their size.</p>
  ${legendHtml()}
  <div class="filters"><input id="q" type="search" placeholder="Search claims and sources" value="${esc(S.ui.q)}" aria-label="Search evidence">
    <select id="tierF" aria-label="Tier"><option value="all">All tiers</option>${TIERS.map(t => `<option value="${t}" ${S.ui.tierF === t ? "selected" : ""}>Tier ${t}</option>`).join("")}</select>
    <select id="domF" aria-label="Domain"><option value="all">All domains</option>${DOMAINS.map(d => `<option value="${d}" ${S.ui.domF === d ? "selected" : ""}>${esc(d)}</option>`).join("")}</select>
    <span class="grow"></span><button class="btn" data-act="add-evidence">Add evidence</button></div>
  ${ev.length ? `<div class="rows">${ev.map(e => `<div class="row click" data-act="open-ev" data-id="${esc(e.id)}" role="button" tabindex="0"><div>${tierChip(e.tier)}</div>
      <div><p class="read" style="margin:0; font-size:16.5px">${esc(e.claim)}</p><p class="meta">${esc(e.source)}${e.date ? `, ${esc(e.date)}` : ""}</p></div>
      <div class="meta">${esc(e.domain || "")}</div></div>`).join("")}</div>` : `<div class="empty">No evidence matches these filters.</div>`}`;
}

/* ---------- principles ---------- */
function viewPrinciples() {
  const ax = [...S.data.axioms].sort((a, b) => (Number(a.order) || 99) - (Number(b.order) || 99));
  return `<h2 class="view">First principles</h2><p class="lead">The axioms every thesis must be derived from. Each names the evidence that holds it up and what would break it.</p>
  <div class="bar"><button class="btn" data-act="add-axiom">Add a principle</button></div>
  <div class="rows">${ax.map(a => `<div class="row"><div class="meta" style="min-width:34px; font-weight:600; color:var(--ink)">${esc(a.label || "")}</div>
    <div><h3>${esc(a.statement)}</h3>${a.why ? `<p class="small" style="color:var(--ink-2)">${esc(a.why)}</p>` : ""}${a.breaks_if ? `<p class="small"><b>Breaks if:</b> ${esc(a.breaks_if)}</p>` : ""}
    <p>${arr(a.evidence).map(id => { const e = byId("evidence", id); return e ? `<button class="evchip" data-act="open-ev" data-id="${esc(id)}">${tierChip(e.tier)}${esc(trunc(e.source, 44))}</button>` : ""; }).join(" ")}</p></div>
    <div><button class="btn quiet small" data-act="edit-axiom" data-id="${esc(a.id)}">Edit</button></div></div>`).join("")}</div>`;
}

/* ---------- landscape ---------- */
function viewLandscape() {
  const groups = STAGES.map(([id, name]) => [id, name, S.data.entities.filter(e => (e.stage || "industry") === id).sort((a, b) => str(a.name).localeCompare(str(b.name)))]).filter(g => g[2].length);
  const other = S.data.entities.filter(e => !STAGES.some(s => s[0] === e.stage));
  return `<h2 class="view">Landscape</h2><p class="lead">Companies, institutions and people, placed on the chain from data to patients. Tiers grade the best public evidence for each, not its funding.</p>
  <div class="bar"><button class="btn" data-act="add-entity">Add to the landscape</button></div>
  ${groups.map(([id, name, list]) => `<div class="section"><h3>${esc(name)}</h3><div class="rows">${list.map(entityRow).join("")}</div></div>`).join("")}
  ${other.length ? `<div class="section"><h3>Other</h3><div class="rows">${other.map(entityRow).join("")}</div></div>` : ""}`;
}
function entityRow(e) {
  return `<div class="row click" data-act="open-entity" data-id="${esc(e.id)}" role="button" tabindex="0"><div>${e.kind === "person" ? `<span class="chip">person</span>` : tierChip(e.tier)}</div>
  <div><h3 style="font-size:17px">${esc(e.name)}</h3><p class="small" style="color:var(--ink-2)">${esc(e.what || e.relation || "")}</p>${e.signal ? `<p class="meta">${esc(e.signal)}</p>` : ""}${horseChips(e.id)}</div>
  <div class="meta">${esc(e.kind || "")}</div></div>`;
}

/* ---------- research ---------- */
function viewResearch() {
  const f = S.ui.resF;
  let rs = S.data.research.filter(r => f === "all" || (f === "open" ? (r.status === "open" || r.status === "needs-web-research") : (r.status !== "open" && r.status !== "needs-web-research")));
  const pr = { high: 0, normal: 1, low: 2 };
  rs.sort((a, b) => ((pr[a.priority] ?? 1) - (pr[b.priority] ?? 1)) || str(b.created_at).localeCompare(str(a.created_at)));
  const canRun = !!S.sample;
  return `<h2 class="view">Research queue</h2><p class="lead">Questions the committee could not settle. Members can take a first pass here, with PubMed for the science; items that need the open web go to Claude in chat, which writes graded evidence back into this corpus.</p>
  <div class="filters"><select id="resF" aria-label="Show"><option value="open" ${f === "open" ? "selected" : ""}>Open</option><option value="done" ${f === "done" ? "selected" : ""}>Answered or closed</option><option value="all" ${f === "all" ? "selected" : ""}>All</option></select>
  <span class="grow"></span><button class="btn quiet" data-act="show-protocol">Deep research in chat</button><button class="btn" data-act="add-research">Add a question</button></div>
  ${rs.length ? `<div class="rows">${rs.map(r => { const t = r.thesis && byId("theses", r.thesis); const busy = S.ui.busy[r.id]; return `<div class="row"><div><span class="chip">${esc(r.priority || "normal")}</span></div>
    <div><h3 style="font-size:17px">${esc(r.question)}</h3><p class="meta">${esc(r.domain || "")}${t ? `, tests ${esc(trunc(t.title, 50))}` : ""}${r.horse && byId("horses", r.horse) ? `, horse ${esc(byId("horses", r.horse).name)}${r.test ? `, ${esc(testInfo(r.test).name.toLowerCase())} test` : ""}` : ""}${r.why ? `. ${esc(r.why)}` : ""}</p>
    ${r.result && r.result.answer ? `<p class="small read" style="font-size:15.5px; white-space:pre-wrap">${esc(trunc(r.result.answer, 900))}</p>` : ""}
    ${r.result && arr(r.result.sources_to_verify).length ? `<p class="small muted">To verify: ${arr(r.result.sources_to_verify).map(esc).join("; ")}</p>` : ""}
    <p class="meta">Status: ${esc(r.status)}${busy ? ", a member is working on it" : ""}</p></div>
    <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end">${canRun && !busy && (r.status === "open" || r.status === "needs-web-research") ? `<button class="btn small" data-act="run-research" data-id="${esc(r.id)}">Take a first pass</button>` : ""}
    <button class="btn quiet small" data-act="edit-research" data-id="${esc(r.id)}">Edit</button></div></div>`; }).join("")}</div>` : `<div class="empty">Nothing here. The committee adds questions when it cannot settle a load-bearing assumption.</div>`}`;
}

/* ---------- concepts ---------- */
function viewConcepts() {
  const cs = [...S.data.concepts].sort((a, b) => str(a.term).localeCompare(str(b.term)));
  return `<h2 class="view">Concepts</h2><p class="lead">The committee's working vocabulary, so ideas keep their meaning between sessions.</p>
  <div class="bar"><button class="btn" data-act="add-concept">Add a concept</button></div>
  <div class="rows">${cs.map(c => `<div class="row"><div></div><div><h3 style="font-size:18px">${esc(c.term)}</h3><p class="read" style="font-size:16px">${esc(c.definition)}</p>${c.related ? `<p class="meta">Related: ${esc(c.related)}</p>` : ""}</div><div><button class="btn quiet small" data-act="edit-concept" data-id="${esc(c.id)}">Edit</button></div></div>`).join("")}</div>`;
}

/* ---------- committee ---------- */
function viewCommittee() {
  const ag = [...S.data.agents].sort((a, b) => (Number(a.order) || 99) - (Number(b.order) || 99));
  return `<h2 class="view">Committee</h2><p class="lead">Specialised members, each with a mandate, a method and a standard of proof. Edit a charter to change how that member argues in future sessions.</p>
  <div class="rows">${ag.map(a => `<div class="row"><div class="meta" style="min-width:24px">${esc(a.order || "")}</div>
    <div><h3>${esc(a.name)}</h3><p class="small" style="color:var(--ink-2)">${esc(a.role)}</p><p class="small"><b>Mandate:</b> ${esc(a.mandate)}</p><p class="small"><b>Standard of proof:</b> ${esc(a.standard_of_proof)}</p>${arr(a.tools).includes("pubmed") ? `<p class="meta">Searches PubMed during sessions</p>` : ""}</div>
    <div><button class="btn quiet small" data-act="edit-agent" data-id="${esc(a.id)}">Edit charter</button></div></div>`).join("")}</div>`;
}

/* ---------- method ---------- */
function protocolText() {
  const url = S.meta && S.meta.links && S.meta.links.artifact ? S.meta.links.artifact : "(this artifact's link)";
  return `Run the research queue for my Bio x AI committee at ${url}.
For each open item: research it with web search and primary sources; add evidence documents (claim, source, url, tier A to U, domain, date); link new evidence to the thesis assumptions it tests; then update the item with a short answer, the evidence ids and a status of answered.
Also refresh the landscape: check for new funding, trial readouts, regulatory decisions and acquisitions in Bio x AI since the last refresh date, and record them the same way.`;
}
function viewMethod() {
  const m = S.meta || {};
  return `<h2 class="view">How the committee works</h2>
  <p class="lead">A thesis is only as strong as its weakest load-bearing assumption. The harness makes that visible and keeps the argument honest over time.</p>
  <div class="section"><h3>The loop</h3><ol class="plain">
    <li>Principles: every thesis must trace back to the first principles on record.</li>
    <li>Assumptions: a thesis is broken into load-bearing assumptions, each linked to graded evidence.</li>
    <li>Committee: members file independent memos inside their mandate; the red team attacks the weakest claims; the chair synthesises, proposes score and status changes, and files research questions.</li>
    <li>Research: questions are answered in the page (with PubMed for the science) or by Claude in chat (with the open web), and the new evidence is written back.</li>
    <li>Update: you decide whether to apply the chair's updates. Coverage and score move only when evidence moves.</li></ol></div>
  <div class="section"><h3>Evidence tiers</h3><dl class="kv">${TIERS.map(t => `<dt>${tierChip(t)}</dt><dd>${esc(TIER_INFO[t])}</dd>`).join("")}</dl>
    <p class="small muted">Evidence coverage counts load-bearing assumptions marked supported whose best evidence is tier A or B.</p></div>
  <div class="section"><h3>Rubric</h3><div class="scroll"><table><thead><tr><th>Criterion</th><th>Weight</th><th>Question</th></tr></thead><tbody>${rubric().map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.weight)}</td><td class="small">${esc(c.question)}</td></tr>`).join("")}</tbody></table></div></div>
  ${horseMethodHtml()}
  ${arr(m.founder_principles).length ? `<div class="section"><h3>Founder operating principles</h3><ul class="plain">${arr(m.founder_principles).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
  <div class="section"><h3>Keeping the landscape current</h3><p>Pages cannot browse the web, so live updates run through Claude in chat, which reads this artifact's records and writes graded evidence back. Paste this into a chat when you want a refresh:</p>
    <pre class="protocol" id="protocol">${esc(protocolText())}</pre>${m.last_refresh ? `<p class="muted small">Last landscape refresh: ${esc(fmtDate(m.last_refresh))}</p>` : ""}</div>
  <div class="section"><h3>Take the corpus with you</h3><div class="bar">${S.dl ? `<button class="btn" data-act="export-json">Download the corpus as JSON</button><button class="btn" data-act="export-md">Download a Markdown brief</button>` : `<span class="muted small">Downloads are not available in this view.</span>`}</div>
    ${m.links && m.links.doc ? `<p class="small">The narrative write-up lives in ${link(m.links.doc, "the Clinical ground truth doc")}.</p>` : ""}</div>
  <div class="section"><h3>Who built this</h3><p class="small">This page was built with Claude. Anthropic, which makes Claude, is itself a participant in the Bio x AI market this committee studies.</p></div>`;
}

/* ---------- writes ---------- */
async function put(coll, id, data) { if (!S.db) throw { message: "The record store is not connected in this view." }; await S.db.collection(coll).doc(id).set(data); }
async function patch(coll, id, data) { if (!S.db) throw { message: "The record store is not connected in this view." }; await S.db.collection(coll).doc(id).update(data); }
async function remove(coll, id) { if (!S.db) throw { message: "The record store is not connected in this view." }; await S.db.collection(coll).doc(id).delete(); }
function clone(o) { return JSON.parse(JSON.stringify(o || {})); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const fn = ACTIONS[b.dataset.act]; if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(b.dataset.id, b.dataset.x, b)).catch(err => toast(errText(err)));
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('.row[role="button"], tr[role="button"]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", e => { if (e.target.id === "q") { S.ui.q = e.target.value; render(); } });
document.addEventListener("change", e => {
  if (e.target.id === "tierF") { S.ui.tierF = e.target.value; render(); }
  if (e.target.id === "domF") { S.ui.domF = e.target.value; render(); }
  if (e.target.id === "resF") { S.ui.resF = e.target.value; render(); }
  if (e.target.id === "hLaneF") { S.ui.hLaneF = e.target.value; render(); }
  if (e.target.id === "hStatF") { S.ui.hStatF = e.target.value; render(); }
});
function go(tab, sel) { S.ui.tab = tab; S.ui.sel = sel || {}; render(); window.scrollTo({ top: 0 }); }

  "tab": id => go(id),
  "back": () => { S.ui.sel = {}; render(); window.scrollTo({ top: 0 }); },
  "open-thesis": id => go("theses", { thesis: id }),
  "open-thesis-from": id => go("theses", { thesis: id }),
  "open-session": id => go("sessions", { session: id }),
  "open-ev": id => openEvidence(id),
  "open-entity": id => openEntity(id),
  "add-thesis": () => editThesis(null),
  "edit-thesis": id => editThesis(id),
  "add-assumption": id => addAssumption(id),
  "link-ev": (id, x) => linkEvidence(id, x),
  "set-status": (id, x) => setAssumptionStatus(id, x),
  "edit-score": (id, x) => editScore(id, x),
  "convene": id => openConvene(id || null),
  "spar": id => openSpar(id || null),
  "add-evidence": () => editEvidence(null),
  "add-entity": () => editEntity(null),
  "add-concept": () => editConcept(null),
  "edit-concept": id => editConcept(id),
  "add-research": () => editResearch(null),
  "edit-research": id => editResearch(id),
  "run-research": id => runResearch(id),
  "add-axiom": () => editAxiom(null),
  "edit-axiom": id => editAxiom(id),
  "edit-agent": id => editAgent(id),
  "apply-updates": id => applyUpdates(id),
  "claim-to-ev": (id, x) => claimToEvidence(id, x),
  "export-json": () => exportJson(),

/* ---------- generic form dialog ---------- */
function fieldHtml(f, i) {
  const id = `f${i}`; const v = f.value == null ? "" : f.value;
  let input = "";
  if (f.type === "textarea" || f.type === "lines") input = `<textarea id="${id}" ${f.rows ? `rows="${f.rows}"` : ""}>${esc(f.type === "lines" ? arr(v).join("\n") : v)}</textarea>`;
  else if (f.type === "select") input = `<select id="${id}">${f.options.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(v) ? "selected" : ""}>${esc(o[1])}</option>`).join("")}</select>`;
  else if (f.type === "checks") input = `<div class="checks" id="${id}">${f.options.map(o => `<label><input type="checkbox" value="${esc(o[0])}" ${arr(v).includes(o[0]) ? "checked" : ""}><span>${o[2] || ""}${esc(o[1])}</span></label>`).join("")}</div>`;
  else input = `<input id="${id}" type="${f.type === "url" ? "url" : "text"}" value="${esc(v)}">`;
  return `<div class="field"><label for="${id}">${esc(f.label)}</label>${input}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</div>`;
}
function readFields(root, fields) {
  const out = {};
  fields.forEach((f, i) => {
    const el = root.querySelector(`#f${i}`);
    if (f.type === "checks") out[f.key] = [...el.querySelectorAll("input:checked")].map(x => x.value);
    else if (f.type === "lines") out[f.key] = el.value.split("\n").map(s => s.trim()).filter(Boolean);
    else out[f.key] = el.value.trim();
  });
  return out;
}
function openForm({ title, intro, fields, submit, onSubmit, danger }) {
  const dlg = $("#dlg");
  dlg.innerHTML = `<form class="dlg" novalidate><h2>${esc(title)}</h2>${intro ? `<p class="muted">${esc(intro)}</p>` : ""}
    ${fields.map(fieldHtml).join("")}<p class="form-err" role="alert"></p>
    <div class="form-actions">${danger ? `<button type="button" class="btn danger" data-f="danger">${esc(danger.label)}</button>` : ""}<span class="grow"></span>
    <button type="button" class="btn quiet" data-f="cancel">Cancel</button><button type="submit" class="btn primary">${esc(submit || "Save")}</button></div></form>`;
  const form = dlg.querySelector("form"); const errEl = form.querySelector(".form-err");
  form.addEventListener("submit", async ev => {
    ev.preventDefault(); const btn = form.querySelector('button[type="submit"]'); btn.disabled = true; errEl.textContent = "";
    try { await onSubmit(readFields(form, fields)); dlg.close(); } catch (e) { errEl.textContent = errText(e); btn.disabled = false; }
  });
  form.querySelector('[data-f="cancel"]').addEventListener("click", () => dlg.close());
  if (danger) {
    const db = form.querySelector('[data-f="danger"]'); let armed = false;
    db.addEventListener("click", async () => {
      if (!armed) { armed = true; db.textContent = "Select again to confirm"; return; }
      try { await danger.run(); dlg.close(); } catch (e) { errEl.textContent = errText(e); }
    });
  }
  dlg.showModal();
}
function openInfo(html) {
  const dlg = $("#dlg");
  dlg.innerHTML = `<div class="dlg">${html}<div class="form-actions"><span class="grow"></span><button type="button" class="btn" data-f="close">Close</button></div></div>`;
  dlg.querySelector('[data-f="close"]').addEventListener("click", () => dlg.close());
  dlg.showModal();
}
function need(v, label) { if (!str(v).trim()) throw { message: `${label} is required.` }; }

/* ---------- evidence ---------- */
function usedBy(evId) {
  const out = [];
  S.data.theses.forEach(t => arr(t.assumptions).forEach(a => { if (arr(a.evidence).includes(evId)) out.push(`${t.title}: ${a.text}`); }));
  S.data.axioms.forEach(a => { if (arr(a.evidence).includes(evId)) out.push(`${a.label} ${a.statement}`); });
  S.data.horses.forEach(h => Object.entries(h.scores || {}).forEach(([k, s]) => { if (arr(s && s.evidence).includes(evId)) out.push(`Horse ${h.name}: ${testInfo(k).name.toLowerCase()} test`); }));
  return out;
}
function openEvidence(id) {
  const e = byId("evidence", id); if (!e) return;
  const uses = usedBy(id);
  const dlg = $("#dlg");
  dlg.innerHTML = `<div class="dlg"><h2>${tierChip(e.tier)} Evidence</h2><p class="read">${esc(e.claim)}</p>
    <dl class="kv"><dt>Source</dt><dd>${link(e.url, e.source || e.url)}</dd><dt>Tier</dt><dd>${esc(TIER_INFO[tierOf(e.tier)])}</dd>${e.date ? `<dt>Date</dt><dd>${esc(e.date)}</dd>` : ""}<dt>Domain</dt><dd>${esc(e.domain || "")}</dd>${e.added_by ? `<dt>Added by</dt><dd>${esc(e.added_by)}</dd>` : ""}</dl>
    ${e.notes ? `<p class="small">${esc(e.notes)}</p>` : ""}
    ${uses.length ? `<p class="small"><b>Holds up:</b></p><ul class="plain small">${uses.map(u => `<li>${esc(trunc(u, 160))}</li>`).join("")}</ul>` : `<p class="small muted">Not linked to any assumption or principle yet.</p>`}
    <div class="form-actions"><button type="button" class="btn quiet" data-f="edit">Edit</button><span class="grow"></span><button type="button" class="btn" data-f="close">Close</button></div></div>`;
  dlg.querySelector('[data-f="close"]').addEventListener("click", () => dlg.close());
  dlg.querySelector('[data-f="edit"]').addEventListener("click", () => { dlg.close(); editEvidence(id); });
  dlg.showModal();
}
function editEvidence(id) {
  const e = id ? byId("evidence", id) : {};
  const fields = [
    { key: "claim", label: "Claim", type: "textarea", value: e.claim, hint: "One checkable statement, in your own words." },
    { key: "source", label: "Source", value: e.source, hint: "Authors, journal or outlet, year." },
    { key: "url", label: "Link", type: "url", value: e.url },
    { key: "tier", label: "Tier", type: "select", value: e.tier || "C", options: TIERS.map(t => [t, `${t}: ${TIER_INFO[t]}`]) },
    { key: "domain", label: "Domain", type: "select", value: e.domain || "industry", options: DOMAINS.map(d => [d, d]) },
    { key: "date", label: "Date of the source", value: e.date, hint: "For example 2026-03 or 2025." },
    { key: "notes", label: "Notes", type: "textarea", value: e.notes }
  ];
  openForm({ title: id ? "Edit evidence" : "Add evidence", fields, submit: id ? "Save evidence" : "Add evidence",
    danger: id ? { label: "Delete evidence", run: () => remove("evidence", id) } : null,
    onSubmit: async v => { need(v.claim, "Claim"); need(v.source, "Source");
      const doc = Object.assign(clone(e), v, { updated_at: nowIso() }); delete doc.id; if (!id) { doc.added_by = "Thomas"; doc.added_at = nowIso(); }
      await put("evidence", id || newId("e", v.source), doc); toast(id ? "Evidence saved" : "Evidence added"); } });
}

/* ---------- theses ---------- */
function editThesis(id) {
  const t = id ? byId("theses", id) : {};

  const fields = [
    { key: "title", label: "Title", value: t.title },
    { key: "one_liner", label: "The thesis in one or two sentences", type: "textarea", value: t.one_liner },
    { key: "positioning", label: "Positioning and comparables", type: "textarea", value: t.positioning },
    { key: "status", label: "Status", type: "select", value: t.status || "active", options: [["lead", "Lead"], ["active", "Active"], ["parked", "Parked"], ["killed", "Killed"]] },
    { key: "falsifiers", label: "What would kill it (one per line)", type: "lines", value: t.falsifiers },
    { key: "gates", label: "Gates (one per line, as name: criteria)", type: "lines", value: arr(t.gates).map(g => `${g.name}: ${g.criteria}`) },
    { key: "risks", label: "Risks (one per line)", type: "lines", value: t.risks },

    danger: id ? { label: "Delete thesis", run: async () => { await remove("theses", id); S.ui.sel = {}; render(); } } : null,
    onSubmit: async v => { need(v.title, "Title");
      const doc = Object.assign(clone(t), v, { gates: v.gates.map(line => { const i = line.indexOf(":"); return i > 0 ? { name: line.slice(0, i).trim(), criteria: line.slice(i + 1).trim() } : { name: line, criteria: "" }; }), updated_at: nowIso() });
      delete doc.id; if (!id) { doc.assumptions = []; doc.scorecard = {}; doc.created_at = nowIso(); }

}
function addAssumption(tid) {
  const t = byId("theses", tid); if (!t) return;

    fields: [{ key: "text", label: "Assumption", type: "textarea" }, { key: "load_bearing", label: "Load-bearing?", type: "select", value: "yes", options: [["yes", "Yes, the thesis fails without it"], ["no", "No, it helps but is not essential"]] }],
    submit: "Add assumption",
    onSubmit: async v => { need(v.text, "Assumption"); const as = clone(t.assumptions); let n = as.length + 1; while (as.some(a => a.id === "a" + n)) n++;
      as.push({ id: "a" + n, text: v.text, load_bearing: v.load_bearing === "yes", status: "unsupported", evidence: [] });
      await patch("theses", tid, { assumptions: as, updated_at: nowIso() }); toast("Assumption added"); } });
}

/* ---------- committee ---------- */
function agentsSorted() { return [...S.data.agents].sort((a, b) => (Number(a.order) || 99) - (Number(b.order) || 99)); }
function openConvene(tid) {
  if (!S.sample) { toast("Claude is not available in this view."); return; }
  const t = tid ? byId("theses", tid) : null;
  const ags = agentsSorted().filter(a => a.id !== "chair");
  const def = ags.filter(a => a.default_panel !== false).map(a => a.id);
  openForm({ title: "Convene the committee", intro: t ? `On: ${t.title}. Each member files an independent memo, the red team attacks the weakest claims, and the chair synthesises. Runs on your Claude usage and takes a few minutes.` : "An open question, not tied to a thesis. Runs on your Claude usage and takes a few minutes.",
    submit: "Convene",
    fields: [{ key: "question", label: "Question before the committee", type: "textarea", value: t ? `Should we advance "${t.title}" to the next gate, and what is its weakest load-bearing assumption?` : "" },
      { key: "panel", label: "Members", type: "checks", value: def, options: ags.map(a => [a.id, `${a.name}: ${trunc(a.role, 70)}`]) }],
    onSubmit: async v => { need(v.question, "Question"); if (!v.panel.length) throw { message: "Choose at least one member." }; setTimeout(() => runCommittee(tid, v.question, v.panel), 0); } });
}
async function pool(items, n, fn) { const q = [...items]; const workers = Array.from({ length: Math.min(n, q.length) }, async () => { while (q.length) { const it = q.shift(); await fn(it); } }); await Promise.all(workers); }
function tierText() { return TIERS.map(t => `${t}: ${TIER_INFO[t]}`).join("\n"); }
function thesisBrief(t) {
  return [`Title: ${t.title}`, `One-liner: ${str(t.one_liner)}`, `Positioning: ${str(t.positioning)}`, `Status: ${str(t.status)}`, "Assumptions:",
    ...arr(t.assumptions).map(a => `- ${a.id} (${a.status || "unsupported"}, best evidence tier ${bestTier(a.evidence)}${a.load_bearing === false ? ", not load-bearing" : ", load-bearing"}): ${a.text} [evidence: ${arr(a.evidence).join(", ") || "none"}]`),
    `Falsifiers: ${arr(t.falsifiers).join(" | ")}`, `Gates: ${arr(t.gates).map(g => g.name + ": " + g.criteria).join(" | ")}`,
    `Current scores: ${Object.entries(t.scorecard || {}).map(([k, v]) => `${k}=${v && v.score}`).join(", ")}`].join("\n");
}
function buildContext(tid, maxEv) {
  const t = tid ? byId("theses", tid) : null;
  const linked = new Set(); if (t) arr(t.assumptions).forEach(a => arr(a.evidence).forEach(id => linked.add(id)));
  const ev = [...S.data.evidence].sort((a, b) => (Number(linked.has(b.id)) - Number(linked.has(a.id))) || (TIERS.indexOf(tierOf(a.tier)) - TIERS.indexOf(tierOf(b.tier))));
  return {
    thesisText: t ? thesisBrief(t) : "No thesis selected: this is an open question.",
    evLines: ev.slice(0, maxEv || 70).map(e => `${e.id} [${tierOf(e.tier)}] ${trunc(e.claim, 240)} (${trunc(e.source, 80)})`).join("\n"),
    axLines: [...S.data.axioms].sort((a, b) => (Number(a.order) || 99) - (Number(b.order) || 99)).map(a => `${a.label || a.id}: ${a.statement}`).join("\n"),
    rubricText: rubric().map(c => `${c.id} (${c.name}, weight ${c.weight}): ${c.question}`).join("\n"),
    people: S.data.entities.filter(e => e.kind === "person").map(p => `${p.name}: ${str(p.relation || p.what)}`).join("\n"),
    founder: arr(S.meta && S.meta.founder_principles).join("\n"),
    landscape: S.data.entities.filter(e => e.kind !== "person").map(e => `${e.name} (${stageName(e.stage)}, tier ${tierOf(e.tier)}): ${trunc(e.what, 90)}${e.signal ? "; " + trunc(e.signal, 80) : ""}`).join("\n")
  };
}
function charter(agent) {
  return `You are "${agent.name}" on a private investment committee that evaluates Bio x AI investment and founding theses from first principles for Thomas, a physician-founder based in Hong Kong.
Your role: ${str(agent.role)}
Your mandate: ${str(agent.mandate)}
Your method: ${str(agent.method)}
Your standard of proof: ${str(agent.standard_of_proof)}
Watch for: ${str(agent.blind_spots)}`;
}
function toolNote(agent, withTools) {
  return withTools ? "You have a pubmed_search tool. Use it for one to three targeted searches when a claim depends on the scientific literature. Cite what you use by DOI link (https://doi.org/...), name PubMed as the source, and mark a claim tier A only when a peer-reviewed article directly shows it."
    : "You cannot browse the web. Use the corpus below and your own knowledge; anything from your own knowledge that is not in the corpus is tier U and must be flagged for verification.";
}
function contextBlock(agent, ctx) {
  let s = `Evidence tiers:\n${tierText()}\n\nFirst principles the committee has adopted:\n${ctx.axLines}\n\nThesis under review:\n${ctx.thesisText}\n\nScoring rubric (0-5 per criterion):\n${ctx.rubricText}\n\nCorpus evidence (id [tier] claim (source)):\n${ctx.evLines}`;
  if (["company", "industry", "market"].includes(agent.domain)) s += `\n\nLandscape on record:\n${ctx.landscape}`;
  if (agent.domain === "relations" && ctx.people) s += `\n\nRelationships on record:\n${ctx.people}`;
  if (agent.domain === "founder" && ctx.founder) s += `\n\nFounder operating principles:\n${ctx.founder}`;
  return s;
}
const MEMO_FORMAT = `Reply with only one JSON object, no other text:
{"headline": "your position in one sentence", "stance": "support" | "oppose" | "mixed" | "insufficient-evidence", "confidence": 0.0 to 1.0, "reasoning": "your argument, 150 to 350 words", "claims": [{"claim": "...", "tier": "A|B|C|D|U", "source": "corpus evidence id, DOI link, or own knowledge", "url": "https://... or empty"}], "risks": ["..."], "questions": ["questions for Thomas or other members"], "research_requests": [{"question": "a specific, answerable question", "domain": "technical|clinical|regulatory|market|company|industry|relations", "why": "which load-bearing assumption it tests"}], "scores": {"criterion_id": 0 to 5, only for criteria inside your remit}}`;
function agentPrompt(agent, ctx, question, prior, withTools) {
  return `${charter(agent)}
${toolNote(agent, withTools)}

${contextBlock(agent, ctx)}
${prior && prior.length ? `\nMemos already filed by other members. Attack the weakest load-bearing claims, cite base rates and counterexamples:\n${prior.map(m => `${m.name} (${m.stance}): ${m.headline} | ${trunc(m.reasoning, 600)} | claims: ${arr(m.claims).map(c => `[${c.tier}] ${trunc(c.claim, 140)}`).join("; ")}`).join("\n")}` : ""}

Question before the committee: ${question}

Write your memo. Argue from first principles and graded evidence, not from narrative or funding momentum: funding and valuations are tier D belief, never proof. Separate what is known from what is assumed. Stay inside your mandate.
${MEMO_FORMAT}`;
}
function chairPrompt(agent, ctx, question, memos) {
  return `${charter(agent)}

${contextBlock(agent, ctx)}

Question before the committee: ${question}

Memos filed:
${memos.map(m => `## ${m.name}: ${m.stance}, confidence ${m.confidence}\nHeadline: ${m.headline}\nReasoning: ${trunc(m.reasoning, 1300)}\nClaims: ${arr(m.claims).map(c => `[${c.tier}] ${trunc(c.claim, 160)} (${trunc(c.source, 60)})`).join("; ")}\nRisks: ${arr(m.risks).join("; ")}\nScores: ${JSON.stringify(m.scores || {})}`).join("\n\n")}

Synthesise. Weigh claims by evidence tier, not by how many members made them. Name the weakest load-bearing assumption. Propose score or status changes only where the memos give evidence-based reasons, using the assumption ids and criterion ids above.
Reply with only one JSON object, no other text:
{"verdict": "advance" | "revise" | "park" | "kill", "summary": "...", "agreements": ["..."], "disagreements": ["..."], "weakest_assumption": "assumption id and why", "decisions": ["..."], "next_tests": [{"test": "...", "kill_if": "...", "by": "date or milestone"}], "score_updates": {"criterion_id": {"score": 0 to 5, "why": "..."}}, "assumption_updates": [{"id": "assumption id", "status": "supported|contested|unsupported|against", "why": "..."}], "research_requests": [{"question": "...", "domain": "...", "why": "..."}]}`;
}
function cleanClaims(v) { return arr(v).slice(0, 12).map(c => ({ claim: trunc(str(c && c.claim), 600), tier: tierOf(c && c.tier), source: trunc(str(c && c.source), 200), url: safeUrl(c && c.url) })).filter(c => c.claim); }
function cleanReqs(v) { return arr(v).slice(0, 6).map(r => ({ question: trunc(str(r && r.question), 400), domain: DOMAINS.includes(r && r.domain) ? r.domain : "industry", why: trunc(str(r && r.why), 300) })).filter(r => r.question); }
function cleanScores(v) { const out = {}; const ids = rubric().map(c => c.id); Object.entries(v || {}).forEach(([k, n]) => { const x = Number(n && typeof n === "object" ? n.score : n); if (ids.includes(k) && x >= 0 && x <= 5) out[k] = Math.round(x); }); return out; }
function normalizeMemo(agent, o) {
  o = o && typeof o === "object" ? o : {};
  const st = ["support", "oppose", "mixed", "insufficient-evidence"].includes(o.stance) ? o.stance : "mixed";
  const conf = Math.max(0, Math.min(1, Number(o.confidence)));
  return { agent: agent.id, name: agent.name, stance: st, confidence: isNaN(conf) ? null : conf, headline: trunc(str(o.headline), 300), reasoning: trunc(str(o.reasoning), 5000),
    claims: cleanClaims(o.claims), risks: arr(o.risks).slice(0, 8).map(x => trunc(str(x), 300)), questions: arr(o.questions).slice(0, 6).map(x => trunc(str(x), 300)),
    research_requests: cleanReqs(o.research_requests), scores: cleanScores(o.scores) };
}
function normalizeChair(o) {
  o = o && typeof o === "object" ? o : {};
  const su = {}; const ids = rubric().map(c => c.id);
  Object.entries(o.score_updates || {}).forEach(([k, v]) => { const n = Number(v && v.score); if (ids.includes(k) && n >= 0 && n <= 5) su[k] = { score: Math.round(n), why: trunc(str(v.why), 400) }; });

function capHint(tid) {

function testRow(h, t) {
  const s = (h.scores || {})[t.id] || {}; const id = esc(h.id), tid = esc(t.id);
  let head;
  if (t.cap === "none") head = `<b>${esc(t.name)}</b> <span>${accessText(typeof s.ok === "boolean" ? s.ok : null)}</span>`;
  else {
    const v = typeof s.score === "number" ? s.score : null;
    head = `<b>${esc(t.name)}</b> ${v == null ? `<span class="muted">not scored</span>` : `<span class="meter" aria-hidden="true"><i style="width:${Math.round(v / 3 * 100)}%"></i></span>${v} of 3`}<span class="muted small">, cited evidence allows up to ${tierCap(t.id, citedTiers(s.evidence))}</span>`;
  }
  return `<div class="assume"><span class="muted" style="font-weight:600">${t.n}</span><div><div>${head}</div>${t.question ? `<div class="muted small">${esc(t.question)}</div>` : ""}
    ${s.why ? `<div class="txt" style="font-size:15.5px; margin-top:4px">${esc(s.why)}</div>` : ""}${t.cap === "none" && s.route ? `<div class="small">Route: ${esc(s.route)}</div>` : ""}
    <div class="ctl">${evChips(s.evidence)}

    ${t.cap !== "none" ? `<button class="linkbtn small" data-act="horse-ev" data-id="${id}" data-x="${tid}">Add evidence</button><button class="linkbtn small" data-act="horse-research" data-id="${id}" data-x="${tid}">Cannot score: file a question</button>` : ""}</div></div></div>`;
}
function horseMethodHtml() {

  <p>Back when P is at least ${p.back_p}, V is at least ${p.back_v}, L is at least ${p.back_l} and access is yes. Track when two of those three thresholds hold, which includes all three without access. Drop otherwise. A horse with any test unscored shows as unscored.</p>

}

/* ---------- horses: actions ---------- */
function editHorse(id) {
  const h = id ? byId("horses", id) : {};
  const ents = S.data.entities.filter(x => x.kind !== "person").sort((a, b) => str(a.name).localeCompare(str(b.name)));
  const eopts = [["", "None"], ...ents.map(x => [x.id, x.name])];
  const cat = h.next_catalyst || {};
  const fields = [
    { key: "name", label: "Name", value: h.name },
    { key: "lane", label: "Lane", value: h.lane, hint: "For example RAS, PD-1 × VEGF, ADC." },
    { key: "originator", label: "Originator", type: "select", value: h.originator || "", options: eopts, hint: "Add the company to the landscape first if it is missing." },
    { key: "licensee", label: "Licensee", type: "select", value: h.licensee || "", options: eopts },
    { key: "territory_note", label: "Territory", type: "textarea", value: h.territory_note },
    { key: "cat_event", label: "Next catalyst", value: cat.event },
    { key: "cat_date", label: "Catalyst date", value: cat.date, hint: "YYYY-MM-DD; leave blank if unknown." },
    { key: "why_you", label: "Why you", type: "textarea", value: h.why_you, hint: "Why you, specifically, have an edge on this horse." },
    { key: "why_basis", label: "The why-you line rests on", type: "select", value: h.why_basis || "", options: [["", "Not set"], ...SCORED_TESTS.map(t => [t.id, testInfo(t.id).name])], hint: "Feeds the non-consensus check: exposure, comparator or leverage count." },
    { key: "status", label: "Status", type: "select", value: h.status || "Scoring", options: HORSE_STATUSES.map(s => [s, s]) }
  ];
  openForm({ title: id ? "Edit horse" : "Add a horse", fields, submit: id ? "Save horse" : "Add horse",
    danger: id ? { label: "Delete horse", run: async () => { await remove("horses", id); S.ui.sel = {}; render(); } } : null,
    onSubmit: async v => {
      need(v.name, "Name");
      if (v.cat_date && !/^\d{4}-\d{2}-\d{2}$/.test(v.cat_date)) throw { message: "Write the catalyst date as YYYY-MM-DD." };
      const doc = Object.assign(clone(h), { name: v.name, lane: v.lane, originator: v.originator || null, licensee: v.licensee || null, territory_note: v.territory_note,
        next_catalyst: v.cat_event || v.cat_date ? { event: v.cat_event, date: v.cat_date || null } : null, why_you: v.why_you, why_basis: v.why_basis || null, status: v.status, updated_at: nowIso() });
      delete doc.id; if (!id) { doc.scores = {}; doc.history = []; doc.created_at = nowIso(); }
      let nid = id; if (!nid) { nid = "h-" + slug(v.name); if (byId("horses", nid)) nid = newId("h", v.name); }
      await put("horses", nid, doc); if (!id) go("horses", { horse: nid }); toast(id ? "Horse saved" : "Horse added"); } });
}
function evBears(e, hid, tid) { return (arr(e.horses).includes(hid) ? 2 : 0) + (arr(e.tests).includes(tid) ? 1 : 0); }
function rescore(hid, tid) {
  const h = byId("horses", hid); const t = testInfo(tid); if (!h || !HORSE_TESTS.some(x => x.id === tid)) return;
  const cur = (h.scores || {})[tid] || {};
  if (t.cap === "none") {
    openForm({ title: `${h.name}: access`, intro: t.question || "Is there a working route to the people who decide on this asset?", submit: "Save access",
      fields: [{ key: "ok", label: "Access", type: "select", value: cur.ok === true ? "yes" : cur.ok === false ? "no" : "", options: [["", "Unknown"], ["yes", "Yes"], ["no", "No"]] },
        { key: "route", label: "Route", type: "textarea", value: cur.route, hint: "Institutions and public roles only; no personal contact details." }],
      onSubmit: async v => { const sc = clone(h.scores); sc.access = { ok: v.ok === "yes" ? true : v.ok === "no" ? false : null, route: v.route, at: nowIso() }; await patch("horses", hid, { scores: sc, updated_at: nowIso() }); toast("Access saved"); } });
    return;
  }
  const ev = [...S.data.evidence].sort((a, b) => (evBears(b, hid, tid) - evBears(a, hid, tid)) || (TIERS.indexOf(tierOf(a.tier)) - TIERS.indexOf(tierOf(b.tier))));
  const anchors = t.anchors || {}; const snap = lastSnapshot();
  const opts = [0, 1, 2, 3].map(n => [String(n), anchors[n] ? `${n}: ${trunc(anchors[n], 90)}` : String(n)]);
  openForm({ title: `${h.name}: ${t.name.toLowerCase()}`, intro: t.question || "", submit: "Save score",
    fields: [{ key: "score", label: "Score", type: "select", value: cur.score == null ? "" : String(cur.score), options: cur.score == null ? [["", "Not scored"], ...opts] : opts },
      { key: "why", label: "Why", type: "textarea", value: cur.why },
      { key: "evidence", label: "Evidence cited", type: "checks", value: arr(cur.evidence), options: ev.map(e => [e.id, `${trunc(e.claim, 100)} (${trunc(e.source, 40)}${e.added_at ? `, filed ${str(e.added_at).slice(0, 10)}` : ""})`, tierChip(e.tier) + " "]),
        hint: capHint(tid) + (snap ? ` A changed score must cite evidence filed after the snapshot of ${snap.date}.` : "") }],
    onSubmit: async v => {
      if (v.score === "") throw { message: "Choose a score, or file a research question if this test cannot be scored yet." };
      const n = Number(v.score);
      const capMsg = capMessage(tid, n, citedTiers(v.evidence)); if (capMsg) throw { message: capMsg };
      const ch = changeAllowed(cur.score == null ? null : cur.score, n, v.evidence, eid => (byId("evidence", eid) || {}).added_at, snap ? str(snap.created_at) : null);
      if (!ch.ok) throw { message: ch.msg };
      const sc = clone(h.scores); sc[tid] = { score: n, why: v.why, evidence: v.evidence, at: nowIso() };
      await patch("horses", hid, { scores: sc, updated_at: nowIso() }); toast("Score saved"); } });
}

    { key: "claim", label: "Claim", type: "textarea", hint: "One checkable statement, in your own words." },

function fileHorseResearch(hid, tid) {

    fields: [{ key: "question", label: "Question", type: "textarea", value: tid ? `What evidence would let us score ${testInfo(tid).name.toLowerCase()} for ${h.name}?` : "", hint: "Specific and answerable." },
      { key: "test", label: "Test", type: "select", value: tid, options: [["", "Not tied to one test"], ...SCORED_TESTS.map(t => [t.id, testInfo(t.id).name])] },

      await put("research", newId("r", v.question), { question: v.question, domain: v.domain, why: v.test ? "The test cannot be scored from the evidence on file." : "", thesis: null, horse: hid, test: v.test || null, priority: v.priority, status: "open", created_at: nowIso(), created_by: "Thomas" });
