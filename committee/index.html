function draftOutreach(hid) {
  const h = byId("horses", hid); if (!h) return;
  const n = horseNumbers(h, hParams()); const sc = h.scores || {};
  const scored = SCORED_TESTS.filter(t => scoreOf(h, t.id) !== null);
  const weakest = scored.filter(t => t.cap === "core").sort((a, b) => scoreOf(h, a.id) - scoreOf(h, b.id))[0];
  const c = h.next_catalyst || {};
  const vars = { name: h.name, originator: entName(h.originator), licensee_part: h.licensee ? `, licensed to ${entName(h.licensee)}` : "",
    why_you: str(h.why_you) || "[why-you line not written yet]",
    scorecard: scored.length ? scored.map(t => `${testInfo(t.id).name.toLowerCase()} ${scoreOf(h, t.id)} of 3`).join(", ") + `; P ${fmtN(n.P)}, E ${fmtN(n.E)}` : "[not scored yet]",
    weakest: weakest ? testInfo(weakest.id).name.toLowerCase() : "[not scored yet]", weakest_why: weakest ? str(sc[weakest.id].why) : "",
    leverage_why: str(sc.leverage && sc.leverage.why) || "[leverage reason not recorded]",
    catalyst: c.event ? `${c.event}${c.date ? ` on ${fmtDate(c.date)}` : ""}` : "your next readout" };
  const tpl = arr(S.meta && S.meta.outreach_template).length === 5 ? S.meta.outreach_template : OUTREACH_DEFAULT;
  const text = tpl.map((x, i) => `${i + 1}. ${str(x.part)}\n${str(x.text).replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? vars[k] : m)}`).join("\n\n");
  const dlg = $("#dlg");
  dlg.innerHTML = `<div class="dlg"><h2>Draft outreach: ${esc(h.name)}</h2><p class="muted small">Built from the scorecard and the why-you line only. Nothing is saved or sent; edit it here, then copy it.</p>
    <textarea class="draft" id="draftText" aria-label="Draft">${esc(text)}</textarea>
    <div class="form-actions"><span class="grow"></span><button class="btn quiet" data-f="close">Close</button><button class="btn primary" data-f="copy">Copy</button></div></div>`;
  dlg.querySelector('[data-f="close"]').addEventListener("click", () => dlg.close());
  dlg.querySelector('[data-f="copy"]').addEventListener("click", () => { const ta = dlg.querySelector("#draftText"); const done = () => toast("Draft copied");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); toast("Select all and copy by hand"); }); else { ta.select(); toast("Select all and copy by hand"); } });
  dlg.showModal();
}

/* ---------- horses: snapshots and stability ---------- */
function snapshotForm() {
  if (byId("rankings", "rk-" + localDay())) { toast("Today's snapshot is already taken. The next one can be taken tomorrow."); return; }
  if (!S.data.horses.length) { toast("Add a horse first."); return; }
  const rows = liveRows(); const unscored = rows.filter(r => !r.complete).length;
  openForm({ title: "Snapshot now", intro: `Freezes the ranked list of ${rows.length} horses with the parameters and validity checks, and adds a history line to each horse whose rank moved.${unscored ? ` ${unscored} horses are not fully scored and are ranked on the tests they have.` : ""}`, submit: "Take the snapshot",
    fields: [{ key: "trigger", label: "Trigger", type: "select", value: "weekly", options: [["weekly", "Weekly review"], ["evidence", "New evidence"], ["catalyst", "Catalyst"], ["manual", "Other"]] }],
    onSubmit: v => takeSnapshot(v.trigger) });
}
async function takeSnapshot(trigger) {
  const day = localDay(); const id = "rk-" + day;
  if (byId("rankings", id)) throw { message: "Today's snapshot is already taken." };
  const p = hParams(); const rows = liveRows(); const hm = new Map(S.data.horses.map(h => [h.id, h]));
  const prev = lastSnapshot(); const prevRank = new Map(arr(prev && prev.rows).map(r => [r.horse, r.rank]));
  const stab = lastStability(); const sm = stab && stab.checks && stab.checks.stability_moves;
  const stability = sm && daysBetween(stab.date, day) <= p.stability_days ? { value: sm.value, pass: sm.pass, date: stab.date } : { value: null, pass: null, note: "due" };
  await put("rankings", id, { date: day, trigger, params: p,
    rows: rows.map(r => ({ horse: r.horse, rank: r.rank, S: r.S, P: r.P, V: r.V, L: r.L, E: r.E, access: r.access, decision: r.decision, catalyst: r.catalyst })),
    checks: { spread_ratio: spreadRatio(rows, p), non_consensus: nonConsensus(rows, hid => hm.get(hid), p), stability_moves: stability },
    created_by: "Thomas", created_at: nowIso() });
  const since = prev ? str(prev.created_at) : ""; let moved = 0;
  for (const r of rows) {
    const was = prevRank.has(r.horse) ? prevRank.get(r.horse) : null;
    if (was === r.rank) continue;
    const h = hm.get(r.horse);
    const cited = [...new Set(Object.values(h.scores || {}).flatMap(s => arr(s && s.evidence)))];
    const fresh = was == null ? [] : cited.filter(eid => str((byId("evidence", eid) || {}).added_at) > since);
    await patch("horses", r.horse, { history: [...arr(h.history), { date: day, rank: r.rank, prev_rank: was, E: r.E, cause: was == null ? "initial" : fresh.length ? "new evidence" : "others moved", evidence: fresh, snapshot: id }] });
    moved++;
  }
  toast(`Snapshot taken. ${moved} ${moved === 1 ? "horse" : "horses"} moved.`);
}
function openSnapshot(id) {
  const r = byId("rankings", id); if (!r) return; const ck = r.checks || {}; const st = r.trigger === "stability";
  openInfo(`<h2>${st ? "Stability check" : "Snapshot"}, ${esc(fmtDate(r.date))}</h2>
    <p class="muted small">Numbers as frozen${st ? "; blind rescores, with the live rank alongside" : `; trigger: ${esc(r.trigger || "manual")}`}. Parameters: p0 ${esc(r.params && r.params.p0)}, slope ${esc(r.params && r.params.slope)}.</p>
    <div class="checkbar">${st ? checkChip("Largest rank move", ck.stability_moves) : checkChip("Spread ratio", ck.spread_ratio) + checkChip("Non-consensus", ck.non_consensus) + checkChip("Stability", ck.stability_moves)}</div>
    <div class="scroll"><table><thead><tr><th class="n">Rank</th><th>Horse</th><th class="n">S</th><th class="n">P</th><th class="n">V</th><th class="n">L</th><th class="n">E</th><th>Decision</th></tr></thead><tbody>
    ${arr(r.rows).map(x => `<tr><td class="n">${esc(x.rank)}${x.live_rank != null ? ` <span class="muted small">(live ${esc(x.live_rank)})</span>` : ""}</td><td>${esc(entOrHorse(x.horse))}</td><td class="n">${esc(x.S)}</td><td class="n">${fmtN(x.P)}</td><td class="n">${esc(x.V)}</td><td class="n">${esc(x.L)}</td><td class="n">${fmtN(x.E)}</td><td>${decisionChip(x.decision)}</td></tr>`).join("")}</tbody></table></div>`);
}
function openStability() {
  const hs = [...S.data.horses].sort((a, b) => str(a.name).localeCompare(str(b.name)));
  if (hs.length < 2) { toast("The stability check needs at least two horses."); return; }
  const p = hParams(); const stab = lastStability(); const dlg = $("#dlg");
  dlg.innerHTML = `<form class="dlg" novalidate><h2>Stability check</h2><p class="muted">Rescore each horse from the evidence it already cites, with its scores and reasons hidden. The check passes when no horse moves more than ${p.stability_max_move} rank against the live ranking. Leave a horse blank to leave it out. Run it once a month${stab ? `; last run ${esc(fmtDate(stab.date))}` : ""}.</p>
    ${hs.map(h => `<div class="section" style="margin-top:18px"><h3>${esc(h.name)}</h3>${SCORED_TESTS.map(t => { const s = (h.scores || {})[t.id] || {}; const fid = `b-${slug(h.id)}-${t.id}`; return `<div class="blind"><label for="${esc(fid)}">${esc(testInfo(t.id).name)}</label><select id="${esc(fid)}" data-h="${esc(h.id)}" data-t="${esc(t.id)}"><option value="">—</option>${[0, 1, 2, 3].map(n => `<option value="${n}">${n}</option>`).join("")}</select><span>${evTags(s.evidence) || `<span class="muted small">no evidence cited</span>`}</span></div>`; }).join("")}</div>`).join("")}
    <p class="form-err" role="alert"></p><div class="form-actions"><span class="grow"></span><button type="button" class="btn quiet" data-f="cancel">Cancel</button><button type="submit" class="btn primary">Record the check</button></div></form>`;
  const form = dlg.querySelector("form"); const errEl = form.querySelector(".form-err");
  form.querySelector('[data-f="cancel"]').addEventListener("click", () => dlg.close());
  form.addEventListener("submit", async ev => { ev.preventDefault(); const btn = form.querySelector('button[type="submit"]'); btn.disabled = true; errEl.textContent = "";
    try { await recordStability(form, hs, p); dlg.close(); } catch (e) { errEl.textContent = errText(e); btn.disabled = false; } });
  dlg.showModal();
}
async function recordStability(form, hs, p) {
  const day = localDay(); const id = `rk-${day}-stability`;
  if (byId("rankings", id)) throw { message: "A stability check is already recorded for today." };
  const vals = {}; form.querySelectorAll("select[data-h]").forEach(el => { (vals[el.dataset.h] = vals[el.dataset.h] || {})[el.dataset.t] = el.value; });
  const blind = [];
  for (const h of hs) {
    const v = vals[h.id] || {};
    if (SCORED_TESTS.every(t => !v[t.id])) continue;
    if (SCORED_TESTS.some(t => !v[t.id])) throw { message: `Score all seven tests for ${h.name}, or leave it blank.` };
    const scores = Object.assign({}, h.scores || {});
    for (const t of SCORED_TESTS) {
      const ids = arr(((h.scores || {})[t.id] || {}).evidence); const n = Number(v[t.id]);
      const msg = capMessage(t.id, n, citedTiers(ids)); if (msg) throw { message: `${h.name}: ${msg}` };
      scores[t.id] = { score: n, evidence: ids };
    }
    blind.push(Object.assign({}, h, { scores }));
  }
  if (blind.length < 2) throw { message: "Rescore at least two horses." };
  const set = new Set(blind.map(h => h.id));
  const blindRows = rankHorses(blind, p); const liveSet = rankHorses(S.data.horses.filter(h => set.has(h.id)), p);
  const mv = maxRankMove(blindRows, liveSet); const liveMap = new Map(liveSet.map(r => [r.horse, r.rank]));
  await put("rankings", id, { date: day, trigger: "stability", params: p,
    rows: blindRows.map(r => ({ horse: r.horse, rank: r.rank, S: r.S, P: r.P, V: r.V, L: r.L, E: r.E, access: r.access, decision: r.decision, live_rank: liveMap.get(r.horse) })),
    checks: { stability_moves: { value: mv, pass: mv <= p.stability_max_move } }, created_by: "Thomas", created_at: nowIso() });
  toast(`Stability check recorded: largest move ${mv}, ${mv <= p.stability_max_move ? "pass" : "fail"}`);
}

/* ---------- calls ---------- */
const CALL_FROZEN_KEYS = ["code", "horse", "question", "type", "unit", "forecast", "frozen_at", "resolve_by", "created_by"];
function callRecord(c) { const o = {}; CALL_FROZEN_KEYS.forEach(k => { if (c[k] !== undefined) o[k] = c[k]; }); return o; }
async function sha256Hex(text) {
  if (!(window.crypto && crypto.subtle)) throw { message: "This browser cannot compute SHA-256 here." };
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function callStatus(c) { return c.resolution ? "resolved" : (c.resolve_by && c.resolve_by < localDay() ? "overdue" : "open"); }
function forecastText(c) { const f = c.forecast || {}; const u = c.unit ? ` ${c.unit}` : ""; return c.type === "binary" ? `${fmtN(f.p * 100)}% yes` : `${f.median}${u} (80%: ${f.p10} to ${f.p90})`; }
function resultText(c) { const r = c.resolution; if (!r) return "—"; return c.type === "binary" ? (r.value ? "yes" : "no") : `${r.value}${c.unit ? " " + c.unit : ""}`; }
function scoreText(c) { const s = c.score; if (!s) return "—"; return c.type === "binary" ? `Brier ${s.brier}` : `${s.inside80 ? "inside" : "outside"} 80%, error ${s.error}`; }
function callsTable(cs) {
  return `<div class="scroll"><table class="wide"><thead><tr><th>Call</th><th>Horse</th><th>Question</th><th>Frozen</th><th>Resolves by</th><th>Forecast</th><th>Status</th><th>Score</th></tr></thead><tbody>
  ${cs.map(c => { const st = callStatus(c); return `<tr class="click" data-act="open-call" data-id="${esc(c.id)}" role="button" tabindex="0"><td class="n">${esc(c.code)}</td><td>${esc(entOrHorse(c.horse))}</td><td class="small">${esc(trunc(c.question, 120))}</td>
    <td class="n">${esc(fmtDate(c.frozen_at))}</td><td class="n">${esc(c.resolve_by)}</td><td class="n small">${esc(forecastText(c))}</td><td><span class="chip ${st === "overdue" ? "oppose" : st === "resolved" ? "support" : ""}">${st}</span></td><td class="n small">${esc(scoreText(c))}</td></tr>`; }).join("")}
  </tbody></table></div>`;
}
function viewCalls() {
  const cs = [...S.data.calls].sort((a, b) => str(b.frozen_at).localeCompare(str(a.frozen_at)));
  const res = cs.filter(c => c.resolution && c.score);
  const bin = res.filter(c => c.type === "binary"); const con = res.filter(c => c.type === "continuous");
  return `<h2 class="view">Calls</h2><p class="lead">Forecasts frozen before the evidence arrives, each hashed so the record cannot drift. Binary calls get a Brier score; continuous calls are checked against their 80% interval and scored by error against the median.</p>
  <div class="nums" style="margin:0 0 10px"><div class="num"><b>${cs.length}</b><span>frozen</span></div><div class="num"><b>${res.length}</b><span>resolved</span></div>
    <div class="num"><b>${bin.length ? fmtN(bin.reduce((a, c) => a + c.score.brier, 0) / bin.length) : "—"}</b><span>mean Brier, ${bin.length} binary</span></div>
    <div class="num"><b>${con.length ? Math.round(100 * con.filter(c => c.score.inside80).length / con.length) + "%" : "—"}</b><span>inside the 80% interval, ${con.length} continuous</span></div></div>
  <p class="small muted">${res.length >= 10 ? "Ten calls have resolved, so full CRPS scoring is now due for continuous calls." : `Full CRPS scoring starts once ten calls resolve (${res.length} of 10 so far).`}</p>
  <div class="bar"><span class="grow"></span><button class="btn" data-act="freeze-call" data-id="">Freeze a call</button></div>
  ${cs.length ? callsTable(cs) : `<div class="empty">No calls yet. Freeze one before the readout it forecasts.</div>`}`;
}
function freezeCall(hid) {
  const hs = [...S.data.horses].sort((a, b) => str(a.name).localeCompare(str(b.name)));
  if (!hs.length) { toast("Add a horse first."); return; }
  const fields = [
    { key: "code", label: "Call code", hint: "Short and unique, for example TT-001-600." },
    { key: "horse", label: "Horse", type: "select", value: hid || hs[0].id, options: hs.map(h => [h.id, h.name]) },
    { key: "question", label: "Question", type: "textarea", hint: "Exactly what settles it: endpoint, line of therapy, dose, cohort." },
    { key: "type", label: "Type", type: "select", value: "continuous", options: [["continuous", "Continuous: a number with an 80% interval"], ["binary", "Binary: yes or no"]] },
    { key: "median", label: "Median (continuous)", hint: "For a rate, write 0.23 for 23%." },
    { key: "p10", label: "10th percentile (continuous)" }, { key: "p90", label: "90th percentile (continuous)" },
    { key: "prob", label: "Probability of yes (binary)", hint: "Between 0 and 1." },
    { key: "unit", label: "Unit", hint: "Optional, for example proportion or months." },
    { key: "resolve_by", label: "Resolves by", hint: "YYYY-MM-DD." }];
  openForm({ title: "Freeze a call", intro: "Once frozen, the forecast cannot be edited. The page computes a SHA-256 of the call and downloads the exact JSON it hashed, for OSF and OpenTimestamps.", fields, submit: "Freeze the call",
    onSubmit: async v => {
      need(v.code, "Call code"); need(v.question, "Question"); need(v.resolve_by, "Resolves by");
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v.resolve_by)) throw { message: "Write the resolution date as YYYY-MM-DD." };
      const id = "c-" + slug(v.code);
      if (byId("calls", id)) throw { message: "A call with this code already exists, and frozen calls cannot be replaced." };
      let forecast;
      if (v.type === "binary") { const pr = num(v.prob); if (pr == null || pr <= 0 || pr >= 1) throw { message: "Give a probability between 0 and 1." }; forecast = { p: pr }; }
      else {
        const m = num(v.median), lo = num(v.p10), hi = num(v.p90);
        if ([m, lo, hi].some(x => x == null)) throw { message: "Give the median and both percentiles as numbers." };
        if (!(lo <= m && m <= hi)) throw { message: "The percentiles must bracket the median: 10th ≤ median ≤ 90th." };
        forecast = { median: m, p10: lo, p90: hi };
      }
      const rec = { code: v.code, horse: v.horse, question: v.question, type: v.type, unit: v.unit, forecast, frozen_at: nowIso(), resolve_by: v.resolve_by, created_by: "Thomas" };
      const text = canonicalJson(rec); const sha = await sha256Hex(text);
      await put("calls", id, Object.assign({}, rec, { resolution: null, score: null, proof: { sha256: sha, osf: "", opentimestamps: "" } }));
      toast("Call frozen"); setTimeout(() => saveFile(`call-${slug(v.code)}.json`, text, "application/json"), 0); } });
}
function openCall(id) {
  const c = byId("calls", id); if (!c) return; const h = byId("horses", c.horse); const pr = c.proof || {}; const dlg = $("#dlg");
  dlg.innerHTML = `<div class="dlg"><h2>Call ${esc(c.code)}</h2><p class="read">${esc(c.question)}</p>
    <dl class="kv"><dt>Horse</dt><dd>${h ? `<button class="linkbtn" data-act="open-horse" data-id="${esc(h.id)}">${esc(h.name)}</button>` : esc(c.horse)}</dd>
    <dt>Type</dt><dd>${esc(c.type)}</dd><dt>Forecast</dt><dd>${esc(forecastText(c))}</dd><dt>Frozen</dt><dd>${esc(c.frozen_at)}</dd><dt>Resolves by</dt><dd>${esc(c.resolve_by)}</dd><dt>Status</dt><dd>${esc(callStatus(c))}</dd>
    <dt>SHA-256</dt><dd class="small" style="word-break:break-all">${esc(pr.sha256 || "—")} <span id="verifyOut" class="muted"></span></dd>
    <dt>OSF</dt><dd>${pr.osf ? link(pr.osf) : "—"}</dd><dt>OpenTimestamps</dt><dd>${pr.opentimestamps ? link(pr.opentimestamps) : "—"}</dd>
    ${c.resolution ? `<dt>Result</dt><dd>${esc(resultText(c))}</dd><dt>Source</dt><dd>${link(c.resolution.source_url)}</dd><dt>Score</dt><dd>${esc(scoreText(c))}</dd>${c.resolution.note ? `<dt>Note</dt><dd>${esc(c.resolution.note)}</dd>` : ""}` : ""}</dl>
    <p class="small muted">The forecast is read-only. Only the proof links and the resolution can still be written.</p>
    <div class="form-actions"><button class="btn quiet" data-f="dl">Download JSON</button><button class="btn quiet" data-f="proof">Proof links</button><span class="grow"></span>${c.resolution ? "" : `<button class="btn" data-f="resolve">Resolve</button>`}<button class="btn" data-f="close">Close</button></div></div>`;
  dlg.querySelector('[data-f="close"]').addEventListener("click", () => dlg.close());
  dlg.querySelector('[data-f="dl"]').addEventListener("click", () => saveFile(`call-${slug(c.code)}.json`, canonicalJson(callRecord(c)), "application/json"));
  dlg.querySelector('[data-f="proof"]').addEventListener("click", () => { dlg.close(); editProof(id); });
  const rb = dlg.querySelector('[data-f="resolve"]'); if (rb) rb.addEventListener("click", () => { dlg.close(); resolveCall(id); });
  sha256Hex(canonicalJson(callRecord(c))).then(x => { const el = dlg.querySelector("#verifyOut"); if (el) el.textContent = x === pr.sha256 ? "(matches the stored record)" : "(does not match: the record changed after freezing)"; }, () => {});
  dlg.showModal();
}
function editProof(id) {
  const c = byId("calls", id); if (!c) return; const pr = c.proof || {};
  openForm({ title: `Proof links for ${c.code}`, intro: `SHA-256 ${pr.sha256 || ""}`, submit: "Save links",
    fields: [{ key: "osf", label: "OSF registration", type: "url", value: pr.osf }, { key: "opentimestamps", label: "OpenTimestamps proof", type: "url", value: pr.opentimestamps }],
    onSubmit: async v => { if ((v.osf && !safeUrl(v.osf)) || (v.opentimestamps && !safeUrl(v.opentimestamps))) throw { message: "Links must start with https://." };
      await patch("calls", id, { proof: Object.assign({}, pr, { osf: v.osf, opentimestamps: v.opentimestamps }) }); toast("Proof links saved"); } });
}
function resolveCall(id) {
  const c = byId("calls", id); if (!c || c.resolution) return;
  const fields = [c.type === "binary" ? { key: "result", label: "Outcome", type: "select", value: "", options: [["", "Choose"], ["yes", "Yes"], ["no", "No"]] } : { key: "result", label: `Observed value${c.unit ? ` (${c.unit})` : ""}` },
    { key: "source_url", label: "Source link", type: "url", hint: "Required: the readout, filing or publication that settles the call." }, { key: "note", label: "Note", type: "textarea" }];
  openForm({ title: `Resolve ${c.code}`, intro: c.question, fields, submit: "Resolve the call",
    onSubmit: async v => {
      const src = safeUrl(v.source_url); if (!src) throw { message: "A source link is required to resolve a call." };
      let value, score;
      if (c.type === "binary") { if (!v.result) throw { message: "Choose the outcome." }; value = v.result === "yes"; score = { brier: brierScore(c.forecast.p, value) }; }
      else { value = num(v.result); if (value == null) throw { message: "Give the observed value as a number." }; score = continuousScore(c.forecast, value); }
      await patch("calls", id, { resolution: { value, source_url: src, note: v.note, resolved_at: nowIso() }, score }); toast("Call resolved"); } });
}

/* ---------- export ---------- */
async function saveFile(name, text, type) {
  if (!S.dl) { toast("Downloads are not available in this view."); return; }
  try { const r = await S.dl.save({ filename: name, data: new Blob([text], { type }) }); if (r && r.status === "saved") toast(`Saved ${name}`); }
  catch (e) { if (e && e.code === "declined") return; toast(e && e.code === "rate_limited" ? "A save is already waiting for your answer." : errText(e)); }
}
function exportJson() { const payload = { exported_at: nowIso(), meta: S.meta }; COLLS.forEach(c => { payload[c] = S.data[c]; }); return saveFile("bio-ai-committee-corpus.json", JSON.stringify(payload, null, 2), "application/json"); }
function exportMd() {
  const L = [];
  L.push("# Bio x AI investment committee", "", `Exported ${fmtDate(nowIso())}.`, "", "## Evidence tiers", ...TIERS.map(t => `- ${t}: ${TIER_INFO[t]}`), "");
  L.push("## First principles", ...[...S.data.axioms].sort((a, b) => (Number(a.order) || 99) - (Number(b.order) || 99)).map(a => `- ${a.label}: ${a.statement} Breaks if: ${str(a.breaks_if)}`), "");
  for (const t of [...S.data.theses].sort((a, b) => statusRank(a.status) - statusRank(b.status))) {
    const m = metrics(t);
    L.push(`## Thesis: ${t.title} (${t.status})`, "", str(t.one_liner), "", `Evidence coverage ${m.coverage}%, rubric score ${m.score}/100, ${m.gaps} unsupported assumptions.`, "", "### Assumptions");
    arr(t.assumptions).forEach(a => L.push(`- [${bestTier(a.evidence)}] (${a.status}) ${a.text}${arr(a.evidence).length ? ` Evidence: ${arr(a.evidence).map(id => { const e = byId("evidence", id); return e ? `${e.source}${e.url ? " " + e.url : ""}` : id; }).join("; ")}` : ""}`));
    if (arr(t.falsifiers).length) L.push("", "### What would kill it", ...arr(t.falsifiers).map(x => `- ${x}`));
    L.push("");
  }
  L.push("## Records");
  [...S.data.sessions].sort((a, b) => str(b.date).localeCompare(str(a.date))).forEach(s => { L.push(`### ${fmtDate(s.date)}: ${s.title || s.question}`); if (s.chair) L.push(`Verdict: ${s.chair.verdict}. ${str(s.chair.summary)}`); arr(s.memos).forEach(m => L.push(`- ${m.name} (${m.stance}): ${m.headline}`)); L.push(""); });
  L.push("## Open research questions", ...S.data.research.filter(r => r.status === "open" || r.status === "needs-web-research").map(r => `- ${r.question} (${r.domain})`), "");
  L.push("## Evidence", ...[...S.data.evidence].sort((a, b) => TIERS.indexOf(tierOf(a.tier)) - TIERS.indexOf(tierOf(b.tier))).map(e => `- [${tierOf(e.tier)}] ${e.claim} Source: ${e.source}${e.url ? " " + e.url : ""}`));
  return saveFile("bio-ai-committee-brief.md", L.join("\n"), "text/markdown");
}
